name: Bug report
description: Report a reproducible problem in UniJam.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve UniJam. Do not include credentials, private room links, or user data.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the issue.
      placeholder: |
        1. Create a room with...
        2. Join as...
        3. Select...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Room role
      options:
        - Host
        - Contributing guest
        - View-only guest
        - Not room-specific
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Music service
      options:
        - Spotify
        - Apple Music
        - Ask each time
        - Not provider-specific
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Safari 19 on iOS 26
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, logs, or related issue links.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, capabilities, and personal data.
          required: true
